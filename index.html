<style>

*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -20%,#22385e,transparent 43%),linear-gradient(#0c1829,#06101c 70%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}
button,input{font:inherit}.app{width:min(760px,100%);margin:auto;padding:18px 16px 35px}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px}.logo{width:40px;height:46px;border:1px solid var(--gold);border-radius:6px;display:grid;place-items:center;color:var(--gold2);font:700 23px Georgia;background:#14243b}.brand b{font:700 21px Georgia,"Noto Serif KR",serif}.brand small{display:block;color:#91a0b4;font-size:11px}.install{display:none;border:1px solid var(--line);background:#101d30;color:var(--gold2);padding:9px 12px;border-radius:12px}
.hero{text-align:center;padding:28px 0 8px}.eye{color:var(--gold);font-size:11px;letter-spacing:.22em}.hero h1{font:700 clamp(31px,8vw,53px)/1.18 Georgia,"Noto Serif KR",serif;margin:12px 0 8px;letter-spacing:-1px}.hero p{margin:0;color:var(--muted);font-size:14px}
.book-zone{height:360px;display:grid;place-items:center;perspective:1400px}.bookwrap{position:relative;width:min(350px,82vw);height:235px;transform-style:preserve-3d;cursor:pointer}.shadow{position:absolute;left:10%;bottom:-25px;width:80%;height:24px;background:#0009;filter:blur(13px);border-radius:50%}.page{position:absolute;inset:7px;background:linear-gradient(90deg,#e2dac5,#fff9ea 45%,#eee5d2);border-radius:9px 20px 20px 9px;color:#172239;display:grid;place-items:center;padding:26px;box-shadow:inset 0 0 25px #a8936a55}.answer{text-align:center;opacity:0;transform:scale(.96);transition:.35s .35s}.bookwrap.open .answer{opacity:1;transform:none}.label{color:#987329;font-size:10px;letter-spacing:.2em;margin-bottom:12px}.q{font-size:12px;color:#737988;margin-bottom:14px;max-height:34px;overflow:hidden}.a{font:700 clamp(23px,6vw,34px)/1.4 Georgia,"Noto Serif KR",serif;word-break:keep-all}.hint{font-size:11px;color:#828895;margin-top:15px;line-height:1.5}

</style></head><body><main class="app">
<header class="top"><div class="brand"><div class="logo">?</div><div><b>한 장의 답</b><small>마음속 질문에, 한 문장.</small></div></div><button id="install" class="install">앱 설치</button></header>
<section class="hero"><div class="eye">RANDOM ANSWER</div><h1>마음속으로 질문을<br>하나 떠올려보세요.</h1><p>책을 누르면 오늘 당신에게 필요한 한 문장이 펼쳐집니다.</p></section>
<div class="book-zone"><div id="book" class="bookwrap" tabindex="0"><div class="shadow"></div><div class="page"><div class="answer"><div class="label">YOUR ANSWER</div><div id="q" class="q">마음속 질문에</div><div id="a" class="a">책을 펼쳐보세요.</div><div id="hint" class="hint"></div></div></div><div class="cover"><div class="coverin"><div class="qm">?</div><div class="ct">한 장의 답</div><div class="cs">TOUCH TO OPEN</div><div class="tap">책을 눌러 펼치기</div></div></div></div></div>

<div id="actions" class="actions"><button id="again">다시 펼치기</button><button id="copy">문구 복사</button><button id="save">이미지 저장</button><button id="share" class="primary">공유하기</button></div>
<div class="histtitle">최근 펼친 답</div><div id="history" class="history"><div class="hist"><span>아직 펼친 답이 없어요.</span></div></div></section>
<footer>자체 제작 랜덤 문구를 사용하는 자기성찰용 앱입니다.<br>중요한 법률·의료·투자·안전 판단은 객관적 정보와 전문가 검토를 기준으로 결정하세요.</footer></main><div id="toast" class="toast"></div>

const H=["이 문장을 읽었을 때 든 첫 반응을 기억해보세요.","마음이 즉시 반박했다면 그 안에 진짜 기준이 있을 수 있어요.","답보다 질문을 조금 바꾸면 더 선명해질 수도 있습니다.","중요한 결정이라면 이 문장은 계기로만 사용하세요.","지금 떠오른 사람이나 숫자가 있다면 그 부분을 다시 확인해보세요."];
let cat="all",last="",cur={q:"",a:"",h:""},defer=null;const rand=x=>x[Math.floor(Math.random()*x.length)];
function toast(m){let t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t.x);t.x=setTimeout(()=>t.style.display="none",1600)}
function pick(){let p=A[cat],a=rand(p);if(a===last&&p.length>1)a=p[(p.indexOf(a)+1)%p.length];last=a;return a}
function open(){cur={q:$("#question").value.trim(),a:pick(),h:rand(H)};$("#q").textContent=cur.q?`“${cur.q}”`:"마음속으로 떠올린 질문에";$("#a").textContent=cur.a;$("#hint").textContent=cur.h;$("#book").classList.add("open");$("#actions").style.display="grid";savehist()}

function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function savehist(){let h=[];try{h=JSON.parse(localStorage.getItem("answerHist")||"[]")}catch{}h.unshift({q:cur.q,a:cur.a});h=h.slice(0,8);localStorage.setItem("answerHist",JSON.stringify(h));render()}
function render(){let h=[];try{h=JSON.parse(localStorage.getItem("answerHist")||"[]")}catch{};$("#history").innerHTML=h.length?h.map(x=>`<div class="hist"><b>${esc(x.q||"마음속 질문")}</b><span>${esc(x.a)}</span></div>`).join(""):'<div class="hist"><span>아직 펼친 답이 없어요.</span></div>'}
function wrap(c,t,x,y,w,lh,max){let l="",ls=[];for(const ch of [...t]){let z=l+ch;if(c.measureText(z).width>w&&l){ls.push(l);l=ch;if(ls.length===max-1)break}else l=z}if(l&&ls.length<max)ls.push(l);let total=(ls.length-1)*lh;ls.forEach((s,i)=>c.fillText(s,x,y-total/2+i*lh))}
async function blob(){let c=document.createElement("canvas");c.width=1080;c.height=1350;let x=c.getContext("2d"),g=x.createLinearGradient(0,0,1080,1350);g.addColorStop(0,"#13243c");g.addColorStop(1,"#07101d");x.fillStyle=g;x.fillRect(0,0,1080,1350);x.strokeStyle="#d8b05a";x.lineWidth=3;x.strokeRect(70,70,940,1210);x.textAlign="center";x.fillStyle="#e3c675";x.font="600 30px system-ui";x.fillText("한 장의 답",540,150);x.fillStyle="#a7b0be";x.font="28px system-ui";wrap(x,cur.q?`“${cur.q}”`:"마음속으로 떠올린 질문에",540,310,820,42,2);x.fillStyle="#f7f0df";x.font="700 62px Georgia";wrap(x,cur.a,540,650,810,86,5);x.fillStyle="#9da9b8";x.font="25px system-ui";wrap(x,cur.h,540,1080,780,40,3);x.fillStyle="#6e7b8e";x.font="21px system-ui";x.fillText("정답이 아니라, 생각을 여는 한 문장.",540,1215);return await new Promise(r=>c.toBlob(r,"image/png",.95))}
async function save(){if(!cur.a)return toast("먼저 책을 펼쳐주세요.");let b=await blob(),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="한장의답.png";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)}
async function share(){if(!cur.a)return toast("먼저 책을 펼쳐주세요.");let b=await blob(),f=new File([b],"한장의답.png",{type:"image/png"}),text=cur.q?`${cur.q}\n\n${cur.a}`:cur.a;try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({title:"한 장의 답",text,files:[f]});else if(navigator.share)await navigator.share({title:"한 장의 답",text});else{await navigator.clipboard.writeText(text);toast("공유 문구를 복사했어요.")}}catch(e){if(e.name!=="AbortError")toast("공유에 실패했어요.")}}
