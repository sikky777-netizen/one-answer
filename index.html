<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101827" />
  <meta name="description" content="마음속 질문에 랜덤한 한 문장으로 답을 건네는 자기성찰용 PWA" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <title>한 장의 답</title>
  <style>
    :root{
      --bg:#0b1220; --panel:#121c2d; --panel2:#182338; --text:#f6f1e5;
      --muted:#aeb8c8; --gold:#d8b56a; --gold2:#f1d796; --line:#283650;
      --danger:#f1a7a7;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:
      radial-gradient(circle at 20% -10%,#1b2a46 0,transparent 42%),
      linear-gradient(180deg,#0b1220,#09101b 70%);
      color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
    body{min-height:100vh}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{width:min(760px,100%);margin:0 auto;padding:22px 18px calc(38px + env(safe-area-inset-bottom))}
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
    .brand{display:flex;align-items:center;gap:12px}
    .bookmark{width:44px;height:52px;border:1px solid #c7a257;border-radius:6px 6px 3px 3px;
      background:linear-gradient(145deg,#22304a,#111b2c);position:relative;box-shadow:0 8px 30px #0006}
    .bookmark:after{content:"?";position:absolute;inset:0;display:grid;place-items:center;color:var(--gold2);font-size:26px;font-family:Georgia,serif}
    .brand h1{font:700 24px/1.1 Georgia,"Noto Serif KR",serif;margin:0;letter-spacing:-.5px}
    .brand small{color:var(--muted);display:block;margin-top:4px}
    .install{display:none;border:1px solid var(--line);background:#111a2a;color:var(--gold2);padding:9px 12px;border-radius:12px}
    .hero{text-align:center;padding:20px 2px 14px}
    .hero .eyebrow{color:var(--gold);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
    .hero h2{font:700 clamp(28px,8vw,48px)/1.18 Georgia,"Noto Serif KR",serif;margin:12px 0 10px;letter-spacing:-1px}
    .hero p{color:var(--muted);margin:0 auto;max-width:560px;line-height:1.65}
    .panel{background:linear-gradient(180deg,#131d2fdd,#0f1828ee);border:1px solid var(--line);
      border-radius:24px;padding:18px;box-shadow:0 18px 60px #0005;margin-top:18px;backdrop-filter:blur(8px)}
    label{display:block;color:#d5dbea;font-size:13px;margin-bottom:8px}
    .question{width:100%;background:#0a1220;border:1px solid #31415f;color:white;border-radius:14px;padding:14px 15px;outline:none}
    .question:focus{border-color:#ba9856;box-shadow:0 0 0 3px #d8b56a20}
    .cats{display:flex;gap:8px;overflow:auto;padding:14px 0 3px;scrollbar-width:none}
    .cats::-webkit-scrollbar{display:none}
    .chip{border:1px solid #31415f;background:#0d1625;color:#c9d1de;border-radius:999px;padding:9px 13px;white-space:nowrap}
    .chip.active{background:var(--gold);border-color:var(--gold);color:#111827;font-weight:700}
    .open-btn{width:100%;margin-top:16px;border:0;border-radius:16px;padding:15px 18px;
      background:linear-gradient(135deg,#c69d4d,#f0d792);color:#16120a;font-weight:800;box-shadow:0 12px 28px #d8b56a25}
    .open-btn:active{transform:translateY(1px)}
    .answer-wrap{display:none;margin-top:18px}
    .answer-card{position:relative;overflow:hidden;min-height:320px;border-radius:24px;padding:28px 24px;
      background:
        radial-gradient(circle at 80% 10%,#d8b56a1b,transparent 30%),
        linear-gradient(145deg,#1c2941,#101827);
      border:1px solid #46536d;box-shadow:inset 0 1px #ffffff0b,0 25px 70px #0005}
    .answer-card:before{content:"";position:absolute;inset:12px;border:1px solid #d8b56a40;border-radius:18px;pointer-events:none}
    .answer-content{position:relative;z-index:1;min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
    .answer-kicker{color:var(--gold);font-size:12px;letter-spacing:.18em;margin-bottom:18px}
    .q-display{color:#bcc6d6;font-size:14px;max-width:90%;margin-bottom:18px;word-break:keep-all}
    .answer-text{font:700 clamp(27px,7vw,44px)/1.35 Georgia,"Noto Serif KR",serif;letter-spacing:-1px;word-break:keep-all}
    .answer-note{margin-top:18px;color:#b3bdcd;font-size:13px;line-height:1.55}
    .answer-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
    .answer-actions button{border:1px solid #34435e;background:#111b2d;color:#eef2f7;border-radius:13px;padding:12px}
    .answer-actions button.primary{color:#17130c;background:#e2c477;border-color:#e2c477;font-weight:700}
    .history{margin-top:22px}
    .history h3{font-size:15px;margin:0 0 9px}
    .history-list{display:grid;gap:8px}
    .hist{padding:11px 12px;border:1px solid #26354f;border-radius:12px;background:#0d1624}
    .hist b{display:block;font-size:13px;color:#e9d39e;margin-bottom:4px}
    .hist span{color:#c4cbd7;font-size:13px}
    footer{color:#7f8a9b;font-size:11px;line-height:1.6;text-align:center;padding:22px 10px 0}
    .shake{animation:shake .35s ease}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
    .fadein{animation:fadein .45s ease}
    @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
      background:#202b3f;color:white;padding:11px 15px;border:1px solid #40506e;border-radius:999px;display:none;z-index:10;box-shadow:0 12px 30px #0007}
    @media(min-width:620px){.answer-actions{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="brand">
      <div class="bookmark" aria-hidden="true"></div>
      <div><h1>한 장의 답</h1><small>마음속 질문에, 한 문장.</small></div>
    </div>
    <button id="installBtn" class="install">앱 설치</button>
  </header>

  <section class="hero">
    <div class="eyebrow">Random Answer</div>
    <h2>답이 필요할 때<br>한 장을 펼쳐보세요.</h2>
    <p>질문을 떠올리거나 직접 적어보세요. 정답이라기보다, 생각의 방향을 바꾸는 한 문장을 건넵니다.</p>
  </section>

  <section class="panel">
    <label for="question">질문 (선택)</label>
    <input id="question" class="question" maxlength="100" placeholder="예: 지금 이 결정을 해도 될까?" autocomplete="off">

    <div class="cats" id="cats" aria-label="카테고리">
      <button class="chip active" data-cat="all">전체</button>
      <button class="chip" data-cat="love">사랑</button>
      <button class="chip" data-cat="money">돈</button>
      <button class="chip" data-cat="work">일</button>
      <button class="chip" data-cat="people">인간관계</button>
      <button class="chip" data-cat="decision">결정</button>
      <button class="chip" data-cat="today">오늘</button>
    </div>

    <button id="openBtn" class="open-btn">답을 펼쳐보기</button>

    <div id="answerWrap" class="answer-wrap">
      <article id="answerCard" class="answer-card">
        <div class="answer-content">
          <div class="answer-kicker">YOUR ANSWER</div>
          <div id="qDisplay" class="q-display"></div>
          <div id="answerText" class="answer-text"></div>
          <div id="answerNote" class="answer-note"></div>
        </div>
      </article>
      <div class="answer-actions">
        <button id="againBtn">다시 뽑기</button>
        <button id="copyBtn">문구 복사</button>
        <button id="saveBtn">이미지 저장</button>
        <button id="shareBtn" class="primary">공유하기</button>
      </div>
    </div>
  </section>

  <section class="history panel">
    <h3>최근 답변</h3>
    <div id="historyList" class="history-list"><div class="hist"><span>아직 펼친 답이 없어요.</span></div></div>
  </section>

  <footer>
    이 앱의 문구는 자체 제작된 랜덤 문장입니다. 특정 도서의 본문을 복제하지 않습니다.<br>
    중요한 법률·의료·투자·안전 판단은 랜덤 답변이 아니라 관련 전문가와 객관적 정보를 기준으로 결정하세요.
  </footer>
</main>
<div id="toast" class="toast"></div>

      lead:["결정을 내려야 한다면","두 선택지 사이에서","지금 기준으로는","불확실성이 크다면","오늘 결정해야 한다면","되돌릴 수 있는 선택이라면","되돌리기 어려운 선택이라면","정보가 부족하다면","마음과 숫자가 다르다면","결정이 무겁게 느껴진다면"],

      tail:["좋은 결정은 모든 불안을 없애주지는 않습니다.","모든 정보를 얻을 때까지 기다리면 기회를 놓칠 수도 있습니다.","반대로 되돌릴 수 없는 결정은 속도보다 검증이 중요합니다.","한 달 뒤의 내가 납득할 선택인지 생각해보세요.","결정 기준을 글로 적으면 감정과 사실이 분리됩니다.","남의 확신이 내 근거가 되지는 않습니다.","확실하지 않다면 계약보다 옵션이 유리할 수 있습니다.","포기 비용도 선택 비용의 일부입니다."]
    },
    today: {
      lead:["오늘은","지금 이 순간에는","오늘 하루만큼은","생각이 많다면","기분을 바꾸고 싶다면","뭔가 하나 해본다면","오늘의 흐름은","큰일보다 먼저","마음이 답답하다면","오늘 저녁 전까지"],
      core:["작은 일 하나를 끝내보세요","연락 하나를 먼저 해보세요","미뤄둔 일을 10분만 시작해보세요","잠깐 밖으로 나가보세요","결정을 하나 줄여보세요","해야 할 일을 세 개만 남겨보세요","좋은 소식을 기다리기보다 하나 만들어보세요","정리부터 시작해보세요","휴식 시간을 미리 정해두세요","쓸데없는 알림 하나를 꺼보세요","고마운 사람에게 짧게 표현해보세요","내일 할 일을 오늘 당겨 하지 않아도 됩니다"],
      tail:["작은 완료감이 생각보다 큰 힘을 줍니다.","오늘의 기분이 인생 전체의 결론은 아닙니다.","20분이면 충분한 일부터 골라보세요.","폰을 잠깐 멀리 두는 것도 괜찮습니다.","한 가지를 끝내면 다음 일이 쉬워집니다.","컨디션이 낮은 날엔 기준을 낮춰도 됩니다.","오늘의 목표는 완벽함보다 회복일 수도 있습니다.","내일을 편하게 만드는 일 하나만 해도 충분합니다."]
    }
  };

  const shortAnswers = [
    "예. 다만 조건을 확인하세요.","아직은 아닙니다.","조금 더 기다려보세요.","이번에는 해보는 쪽입니다.",
    "서두르지 마세요.","다른 선택지가 있습니다.","처음 생각을 다시 보세요.","작게 시작하세요.",
    "그만두기엔 이릅니다.","지금은 내려놓는 편이 낫습니다.","한 번 더 확인하세요.","상대의 행동을 보세요.",
    "숫자를 다시 계산하세요.","오늘은 결정하지 마세요.","당신이 먼저 움직여도 됩니다.","이번에는 선을 지키세요.",
    "기회는 있지만 조건이 붙습니다.","답은 가까운 곳에 있습니다.","예상과 다른 방향을 보세요.","확신이 생길 때까지 계약하지 마세요.",
    "한 가지를 포기하면 쉬워집니다.","다시 시작해도 괜찮습니다.","말보다 기록을 남기세요.","지금의 불안이 경고인지 피로인지 구분하세요.",
    "작은 테스트가 답입니다.","오늘 안에 하나는 끝내세요.","결정권자를 먼저 확인하세요.","돈보다 시간을 계산하세요.",
    "이번에는 보수적으로 가세요.","좋은 신호가 있습니다. 과신은 금물입니다.","미련보다 기준을 보세요.","한 걸음 물러서면 더 잘 보입니다."
  ];

  const notes = [
    "정답을 맞히려 하지 말고, 이 문장을 읽었을 때 드는 첫 반응을 살펴보세요.",
    "마음이 즉시 반박했다면 그 반박 속에 당신의 진짜 기준이 있을 수 있어요.",
    "이 문장이 마음에 든 이유와 싫은 이유를 각각 한 줄씩 적어보세요.",
    "중요한 결정이라면 랜덤 문장은 계기로만 쓰고, 실제 근거를 따로 확인하세요.",
    "지금 떠오른 사람이나 숫자 하나가 있다면 그 부분을 다시 확인해보세요.",
    "답보다 질문을 조금 바꾸면 더 선명해질 수도 있습니다."
  ];

  let category = "all";
  let lastAnswer = "";
  let deferredPrompt = null;
  let current = {question:"",answer:"",note:""};

  function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function generate(cat){
    // 약 32회 중 1회는 짧은 직답형
    if(Math.random() < 0.032) return rand(shortAnswers);
    const b = banks[cat] || banks.all;
    let text = `${rand(b.lead)} ${rand(b.core)}. ${rand(b.tail)}`;
    if(text === lastAnswer) return generate(cat);
    lastAnswer = text;
    return text;
  }
  function toast(msg){
    const t=$("#toast"); t.textContent=msg; t.style.display="block";
    clearTimeout(t._timer); t._timer=setTimeout(()=>t.style.display="none",1700);
  }
  function showAnswer(){
    const q=$("#question").value.trim();
    const ans=generate(category);
    const note=rand(notes);
    current={question:q,answer:ans,note};
    $("#qDisplay").textContent=q ? `“${q}”` : "마음속으로 떠올린 질문에";
    $("#answerText").textContent=ans;
    $("#answerNote").textContent=note;
    $("#answerWrap").style.display="block";
    $("#answerCard").classList.remove("fadein","shake");
    void $("#answerCard").offsetWidth;
    $("#answerCard").classList.add("fadein");
    saveHistory();
    $("#answerWrap").scrollIntoView({behavior:"smooth",block:"center"});
  }
  function saveHistory(){
    let h=[];
    try{h=JSON.parse(localStorage.getItem("oneAnswerHistory")||"[]")}catch{}
    h.unshift({q:current.question,a:current.answer,t:Date.now()});
    h=h.slice(0,8);
    localStorage.setItem("oneAnswerHistory",JSON.stringify(h));
    renderHistory();
  }
  function renderHistory(){
    let h=[];
    try{h=JSON.parse(localStorage.getItem("oneAnswerHistory")||"[]")}catch{}
    const box=$("#historyList");
    if(!h.length){box.innerHTML='<div class="hist"><span>아직 펼친 답이 없어요.</span></div>';return}
    box.innerHTML=h.map(x=>`<div class="hist"><b>${escapeHtml(x.q||"마음속 질문")}</b><span>${escapeHtml(x.a)}</span></div>`).join("");
  }
  function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

  async function makeImageBlob(){
    const canvas=document.createElement("canvas");
    canvas.width=1080; canvas.height=1350;
    const ctx=canvas.getContext("2d");
    const grad=ctx.createLinearGradient(0,0,1080,1350);
    grad.addColorStop(0,"#101a2c"); grad.addColorStop(1,"#080e18");
    ctx.fillStyle=grad; ctx.fillRect(0,0,1080,1350);
    ctx.strokeStyle="#c9a65d"; ctx.lineWidth=3; roundRect(ctx,70,70,940,1210,34); ctx.stroke();
    ctx.fillStyle="#d8b56a"; ctx.font='600 30px system-ui, "Noto Sans KR"'; ctx.textAlign="center";
    ctx.fillText("한 장의 답",540,145);
    ctx.fillStyle="#9eabbc"; ctx.font='28px system-ui, "Noto Sans KR"';
    const q=current.question ? `“${current.question}”` : "마음속으로 떠올린 질문에";
    drawWrapped(ctx,q,540,280,820,44,2);
    ctx.fillStyle="#f6f1e5"; ctx.font='700 60px Georgia, "Noto Serif KR", serif';
    drawWrapped(ctx,current.answer,540,520,810,84,6);
    ctx.fillStyle="#98a5b7"; ctx.font='25px system-ui, "Noto Sans KR"';
    drawWrapped(ctx,current.note,540,1040,790,40,3);
    ctx.fillStyle="#6f7c90"; ctx.font='22px system-ui, "Noto Sans KR"';
    ctx.fillText("정답이 아니라, 생각을 여는 한 문장.",540,1215);
    return await new Promise(resolve=>canvas.toBlob(resolve,"image/png",0.95));
  }
  function roundRect(ctx,x,y,w,h,r){
    ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function drawWrapped(ctx,text,cx,y,maxWidth,lineHeight,maxLines){
    const words=[...text]; let line="", lines=[];
    for(const ch of words){
      const test=line+ch;
      if(ctx.measureText(test).width>maxWidth && line){lines.push(line);line=ch;if(lines.length===maxLines-1)break}
      else line=test;
    }
    if(line && lines.length<maxLines) lines.push(line);
    const total=(lines.length-1)*lineHeight;
    lines.forEach((l,i)=>ctx.fillText(l,cx,y-total/2+i*lineHeight));
  }
  async function saveImage(){
    if(!current.answer){toast("먼저 답을 펼쳐주세요.");return}
    const blob=await makeImageBlob();
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="한장의답.png"; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  }
  async function share(){
    if(!current.answer){toast("먼저 답을 펼쳐주세요.");return}
    const blob=await makeImageBlob();
    const file=new File([blob],"한장의답.png",{type:"image/png"});
    const text=current.question ? `${current.question}\n\n${current.answer}` : current.answer;
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({title:"한 장의 답",text,files:[file]});
      }else if(navigator.share){
        await navigator.share({title:"한 장의 답",text});
      }else{
        await navigator.clipboard.writeText(text); toast("공유 문구를 복사했어요.");
      }
    }catch(e){ if(e.name!=="AbortError") toast("공유에 실패했어요."); }
  }

  $$("#cats .chip").forEach(btn=>btn.addEventListener("click",()=>{
    $$("#cats .chip").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active"); category=btn.dataset.cat;
  }));
  $("#openBtn").addEventListener("click",showAnswer);
  $("#againBtn").addEventListener("click",()=>{
    $("#answerCard").classList.remove("shake"); void $("#answerCard").offsetWidth; $("#answerCard").classList.add("shake");
    setTimeout(showAnswer,230);
  });
  $("#copyBtn").addEventListener("click",async()=>{
    if(!current.answer){toast("먼저 답을 펼쳐주세요.");return}
    const text=current.question ? `${current.question}\n\n${current.answer}` : current.answer;
    try{await navigator.clipboard.writeText(text);toast("복사했어요.");}catch{toast("복사하지 못했어요.");}
  });
  $("#saveBtn").addEventListener("click",saveImage);
  $("#shareBtn").addEventListener("click",share);
  $("#question").addEventListener("keydown",e=>{if(e.key==="Enter")showAnswer()});

  window.addEventListener("beforeinstallprompt",e=>{
    e.preventDefault(); deferredPrompt=e; $("#installBtn").style.display="block";
  });
  $("#installBtn").addEventListener("click",async()=>{
    if(!deferredPrompt){toast("브라우저 메뉴에서 홈 화면에 추가할 수 있어요.");return}
    deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; $("#installBtn").style.display="none";
  });
  window.addEventListener("appinstalled",()=>toast("홈 화면에 설치됐어요."));

  if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
  renderHistory();
})();
</script>
